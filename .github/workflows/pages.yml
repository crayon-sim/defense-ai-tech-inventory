name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild inventory data from sources
        run: |
          python3 scripts/parse_2022.py > /dev/null
          python3 scripts/parse_2023.py > /dev/null
          python3 scripts/parse_2024.py > /dev/null
          python3 scripts/parse_2025_ch3.py > /dev/null
          python3 scripts/parse_2025_ch2.py > /dev/null
          python3 scripts/parse_2026.py > /dev/null
          python3 scripts/build_inventory.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
